name: Build Android APK with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Fix DNS & Runner Mirrors
        run: |
          # Fix Azure mirror DNS resolution failures on GitHub Actions
          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf > /dev/null
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf > /dev/null
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list 2>/dev/null || true
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3 || true

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install buildozer "cython<3.0.0" virtualenv

      - name: Build APK using Buildozer
        run: |
          buildozer -v android debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartExpenseTracker-Debug-APK
          path: bin/*.apk
